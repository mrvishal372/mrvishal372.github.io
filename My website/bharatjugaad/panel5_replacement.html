        <div class="workspace-panel" id="panel-5">
            <div class="workspace-header" style="background: rgba(255,255,255,0.7); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(0,0,0,0.05); z-index: 10;">
                <div class="workspace-title-group">
                    <span class="workspace-icon" style="font-size: 1.5rem;">🍛</span>
                    <div class="workspace-title" id="mod5Header" style="font-weight: 700; font-size: 1.25rem;">Smart Kitchen Assistant</div>
                </div>
                <button class="btn-close-workspace ripple" onclick="closeWorkspace()" style="width: 36px; height: 36px; border-radius: 50%; background: rgba(0,0,0,0.05); color: #333;"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="kitchen-container" style="padding: 16px; display: flex; flex-direction: column; gap: 16px; height: calc(100% - 60px); overflow-y: auto;">
                
                <!-- Search & Filters -->
                <div class="kitchen-glass-card" style="padding: 16px; display: flex; flex-direction: column; gap: 12px; background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.6); box-shadow: 0 8px 32px rgba(0,0,0,0.05); border-radius: 20px;">
                    <div class="kitchen-search-box" style="display: flex; align-items: center; background: rgba(255,255,255,0.7); border-radius: 16px; padding: 12px 16px; gap: 12px; border: 1px solid rgba(0,0,0,0.05); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);">
                        <i class="fa-solid fa-magnifying-glass" style="color: #666; font-size: 1.1rem;"></i>
                        <input type="text" id="kitchenSearchInput" class="kitchen-search-input" placeholder="Search ingredients (e.g., Tomato, आलू)..." style="flex: 1; border: none; background: transparent; outline: none; font-size: 1rem; color: #333; font-weight: 500;" oninput="renderIngredientGrid()">
                        <button class="voice-search-btn ripple" onclick="startKitchenVoiceSearch()" style="background: rgba(59, 130, 246, 0.1); color: #3B82F6; border: none; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s;">
                            <i class="fa-solid fa-microphone"></i>
                        </button>
                    </div>

                    <div class="kitchen-cat-scroller" id="kitchenCatPills" style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch;">
                        <!-- Categories rendered by JS -->
                    </div>

                    <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 4px; border-top: 1px solid rgba(0,0,0,0.05); margin-top: 4px;">
                        <div style="font-size: 0.9rem; color: #555; font-weight: 600;">
                            Selected: <span id="selectedCountBadge" style="background: #3B82F6; color: white; padding: 2px 8px; border-radius: 12px; font-size: 0.8rem; margin-left: 4px; box-shadow: 0 2px 4px rgba(59, 130, 246, 0.3);">0</span>
                        </div>
                        <div style="display: flex; gap: 8px;">
                            <button class="kitchen-action-btn ripple" onclick="selectAllIngredients()" style="background: rgba(34, 197, 94, 0.1); color: #22C55E; border: none; border-radius: 8px; padding: 6px 12px; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: all 0.2s;">Select All</button>
                            <button class="kitchen-action-btn ripple" onclick="clearAllIngredients()" style="background: rgba(239, 68, 68, 0.1); color: #EF4444; border: none; border-radius: 8px; padding: 6px 12px; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: all 0.2s;">Clear All</button>
                        </div>
                    </div>
                </div>

                <!-- Ingredients Grid -->
                <div id="ingredientChipsGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; padding: 4px;">
                    <!-- Ingredients rendered by JS -->
                </div>

                <!-- AI Button -->
                <div style="position: sticky; bottom: 0; padding: 16px 0; background: linear-gradient(to top, var(--bg-color) 70%, transparent); margin-top: auto; display: flex; justify-content: center; z-index: 10;">
                    <button class="btn-primary ripple" onclick="generateRecipes()" style="width: 100%; max-width: 400px; padding: 16px 24px; border-radius: 20px; font-size: 1.1rem; font-weight: 700; background: linear-gradient(135deg, #FF9933, #FF6B6B); box-shadow: 0 8px 24px rgba(255, 153, 51, 0.4); display: flex; align-items: center; justify-content: center; gap: 12px; border: none; color: white; cursor: pointer; transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);">
                        <i class="fa-solid fa-wand-magic-sparkles" style="font-size: 1.2rem;"></i>
                        <span>Generate AI Recipes</span>
                    </button>
                </div>

                <!-- Recipe Results -->
                <div id="recipeResultsWrapper" style="display: none; flex-direction: column; gap: 16px; padding-bottom: 30px;">
                    <div id="aiKitchenBanner" class="ai-kitchen-banner"></div>
                    <div id="recipeResultsGrid" style="display: grid; gap: 16px;"></div>
                </div>
            </div>
        </div>
