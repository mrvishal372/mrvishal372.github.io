        <!-- ==========================================================================
             MODULE 5 WORKSPACE: AajKyaBanau 🍛
             ========================================================================== -->
        <div class="workspace-panel" id="panel-5" style="background: var(--bg-color); height: 100vh; overflow: hidden; display: flex; flex-direction: column;">
            
            <div class="workspace-header" style="background: rgba(255,255,255,0.7); backdrop-filter: saturate(180%) blur(24px); -webkit-backdrop-filter: saturate(180%) blur(24px); border-bottom: 1px solid rgba(0,0,0,0.05); z-index: 50; position: sticky; top: 0; padding: 12px 16px;">
                <div class="workspace-title-group">
                    <div style="background: linear-gradient(135deg, #FF9933, #FF6B6B); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; font-size: 1.4rem; letter-spacing: -0.5px;">Smart Kitchen</div>
                </div>
                <div style="display: flex; gap: 12px; align-items: center;">
                    <button class="ripple" onclick="showSavedRecipes()" style="background: rgba(0,0,0,0.05); border: none; width: 36px; height: 36px; border-radius: 50%; color: #333; display: flex; justify-content: center; align-items: center; transition: transform 0.2s;"><i class="fa-solid fa-heart"></i></button>
                    <button class="btn-close-workspace ripple" onclick="closeWorkspace()" style="width: 36px; height: 36px; border-radius: 50%; background: rgba(0,0,0,0.05); color: #333; display: flex; justify-content: center; align-items: center;"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </div>

            <div class="kitchen-container" style="flex: 1; overflow-y: auto; scroll-behavior: smooth; padding: 12px; display: flex; flex-direction: column; gap: 16px; padding-bottom: 120px; -webkit-overflow-scrolling: touch;">
                
                <!-- Sticky Search & Filters Container -->
                <div style="position: sticky; top: 0; z-index: 40; padding-top: 8px; padding-bottom: 12px; background: linear-gradient(to bottom, var(--bg-color) 80%, transparent);">
                    <div class="kitchen-glass-card" style="padding: 12px; display: flex; flex-direction: column; gap: 12px; background: rgba(255, 255, 255, 0.65); backdrop-filter: saturate(200%) blur(32px); -webkit-backdrop-filter: saturate(200%) blur(32px); border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 12px 32px rgba(0,0,0,0.04); border-radius: 24px;">
                        
                        <div style="display: flex; align-items: center; background: rgba(0,0,0,0.04); border-radius: 18px; padding: 8px 16px; gap: 12px; border: 1px solid rgba(255,255,255,0.4); box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);">
                            <i class="fa-solid fa-magnifying-glass" style="color: #666; font-size: 1.1rem;"></i>
                            <input type="text" id="kitchenSearchInput" placeholder="Search ingredients (e.g. Potato, आलू)" style="flex: 1; border: none; background: transparent; outline: none; font-size: 1rem; color: #333; font-weight: 500; height: 30px;" oninput="renderIngredientGrid()">
                            <button class="ripple" onclick="startKitchenVoiceSearch()" style="background: rgba(59, 130, 246, 0.1); color: #3B82F6; border: none; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer;">
                                <i class="fa-solid fa-microphone"></i>
                            </button>
                        </div>

                        <div id="kitchenCatPills" style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; -ms-overflow-style: none;">
                            <!-- Categories rendered by JS -->
                        </div>
                        
                        <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 4px;">
                            <div style="font-size: 0.9rem; color: #555; font-weight: 700; display: flex; align-items: center; gap: 6px;">
                                <i class="fa-solid fa-basket-shopping" style="color: #FF9933;"></i> Selected: 
                                <span id="selectedCountBadge" style="background: #FF9933; color: white; padding: 2px 8px; border-radius: 12px; font-size: 0.8rem; box-shadow: 0 4px 12px rgba(255, 153, 51, 0.3);">0</span>
                            </div>
                            <div style="display: flex; gap: 8px;">
                                <button class="ripple" onclick="selectAllIngredients()" style="background: rgba(34, 197, 94, 0.1); color: #16A34A; border: none; border-radius: 10px; padding: 6px 12px; font-size: 0.8rem; font-weight: 700;">Select All</button>
                                <button class="ripple" onclick="clearAllIngredients()" style="background: rgba(239, 68, 68, 0.1); color: #DC2626; border: none; border-radius: 10px; padding: 6px 12px; font-size: 0.8rem; font-weight: 700;">Clear</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Ingredients Grid -->
                <div id="ingredientChipsGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; padding: 4px;">
                    <!-- Ingredients rendered by JS -->
                </div>
                
                <!-- Recipe Results -->
                <div id="recipeResultsWrapper" style="display: none; flex-direction: column; gap: 16px; margin-top: 16px; animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1);">
                    <div id="aiKitchenBanner"></div>
                    <div id="recipeResultsGrid" style="display: grid; gap: 20px;"></div>
                </div>
            </div>

            <!-- Floating AI Button -->
            <div style="position: absolute; bottom: 30px; left: 0; right: 0; padding: 0 20px; display: flex; justify-content: center; z-index: 50; pointer-events: none;">
                <button class="btn-primary ripple" onclick="generateRecipes()" style="pointer-events: auto; width: 100%; max-width: 360px; padding: 18px 24px; border-radius: 30px; font-size: 1.15rem; font-weight: 800; background: linear-gradient(135deg, #FF9933, #FF6B6B); box-shadow: 0 12px 32px rgba(255, 107, 107, 0.4); display: flex; align-items: center; justify-content: center; gap: 12px; border: none; color: white; cursor: pointer; transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);">
                    <i class="fa-solid fa-wand-magic-sparkles" style="font-size: 1.3rem; animation: pulse 2s infinite;"></i>
                    <span id="btnGetRecipes">Generate AI Recipes</span>
                </button>
            </div>
            
        </div>
